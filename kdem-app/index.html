<title>KDEM Startup Tracker</title>
<style>
/* Layout: fixed top bar + left nav on desktop, stacked on phone; data-dense dashboard + table workspace.
   Palette: deep civic indigo primary, warm amber attention accent, neutral slate greys with a cool bias.
   Type: IBM Plex Sans (UI), IBM Plex Mono (figures, IDs). */
:root{
  --bg:#f3f2f0; --surface:#ffffff; --surface-2:#f8f7f4; --line:#e4e0da; --line-soft:#edeae5;
  --fg:#1b1c1f; --muted:#5f6269; --faint:#8d9099;
  --primary:#e04e1f; --primary-ink:#ffffff; --primary-soft:#fce7dc;
  --accent:#1f6f8b; --accent-soft:#dcebf1;
  --good:#1f7a46; --good-soft:#dcefe3; --warn:#a66a00; --warn-soft:#faecc6;
  --bad:#c23a2a; --bad-soft:#f7ddd7; --info:#1f6f8b; --info-soft:#dcebf1;
  --masthead:#1f2024; --masthead-ink:#f6f5f3; --masthead-line:#39393c;
  --shadow:0 1px 2px rgba(28,26,24,.05),0 4px 14px rgba(28,26,24,.06);
  --radius:9px; --radius-sm:6px;
  --display:"Archivo","Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1d1d1f; --surface-2:#191919; --line:#33322f; --line-soft:#272726;
  --fg:#f0efec; --muted:#a3a19b; --faint:#726f69;
  --primary:#f2693b; --primary-ink:#1a0e08; --primary-soft:#3a2016;
  --accent:#5aa9c6; --accent-soft:#14323d;
  --good:#5bc98b; --good-soft:#16321f; --warn:#e0b24e; --warn-soft:#342a12;
  --bad:#e8826f; --bad-soft:#3a1d18; --info:#5aa9c6; --info-soft:#14323d;
  --masthead:#0f0f10; --masthead-ink:#f3f2ef; --masthead-line:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1d1d1f; --surface-2:#191919; --line:#33322f; --line-soft:#272726;
  --fg:#f0efec; --muted:#a3a19b; --faint:#726f69;
  --primary:#f2693b; --primary-ink:#1a0e08; --primary-soft:#3a2016;
  --accent:#5aa9c6; --accent-soft:#14323d;
  --good:#5bc98b; --good-soft:#16321f; --warn:#e0b24e; --warn-soft:#342a12;
  --bad:#e8826f; --bad-soft:#3a1d18; --info:#5aa9c6; --info-soft:#14323d;
  --masthead:#0f0f10; --masthead-ink:#f3f2ef; --masthead-line:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-wrap:balance;letter-spacing:-.015em}
button{font-family:inherit;cursor:pointer}
a{color:var(--primary)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* App frame */
#app{min-height:100%}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--masthead);color:var(--masthead-ink);
  display:flex;align-items:center;gap:13px;padding:11px 20px;border-bottom:3px solid var(--primary)}
#top .brand{display:flex;align-items:center;gap:13px;min-width:0}
#top .logo-tile{flex:none;display:grid;place-items:center;background:#fff;border-radius:10px;padding:6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#top .mark{height:30px;width:auto;display:block}
#top .wordmark{min-width:0}
#top .brand b{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;display:block;line-height:1.15}
#top .brand span{display:block;font-size:10px;opacity:.68;white-space:nowrap;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
#top .spacer{flex:1}
#top .who{font-size:12px;opacity:.95;display:flex;align-items:center;gap:8px;white-space:nowrap}
#top .rolechip{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;font-weight:600;font-size:11px}
.iconbtn{background:rgba(255,255,255,.14);color:var(--primary-ink);border:0;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600}
.iconbtn:hover{background:rgba(255,255,255,.24)}

.layout{display:flex;align-items:flex-start;gap:0}
nav#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);flex:none;width:210px;padding:16px 12px;
  display:flex;flex-direction:column;gap:3px;height:calc(100vh - 56px);overflow:auto}
nav#side .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
  color:var(--muted);padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500}
nav#side .navbtn:hover{background:var(--surface);color:var(--fg)}
nav#side .navbtn.on{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
nav#side .navbtn .ic{width:18px;text-align:center;flex:none}
nav#side .seg{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:14px 12px 5px;font-weight:600}
main{flex:1;min-width:0;padding:20px 24px 60px}

.banner{margin:0 0 16px;padding:10px 14px;border-radius:var(--radius-sm);font-size:12.5px;display:flex;gap:9px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.good{background:var(--good-soft);color:var(--good)}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:23px}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.kicker{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);font-family:var(--mono);margin-bottom:5px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);position:relative}
.kpi .lab{font-size:11px;color:var(--muted);font-weight:600;line-height:1.35;min-height:30px;letter-spacing:.01em;text-transform:uppercase}
.kpi .val{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--faint);margin-top:5px;font-weight:500}
.kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--line);border-radius:2px}
.kpi.g::after{background:var(--good)} .kpi.a::after{background:var(--accent)}
.kpi.w::after{background:var(--warn)} .kpi.b::after{background:var(--bad)} .kpi.i::after{background:var(--info)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .ch{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .ch h3{font-size:14px}
.card .ch .note{font-size:11px;color:var(--faint)}
.card .cb{padding:14px 16px}

/* bar rows */
.bar{display:grid;grid-template-columns:150px 1fr 42px;align-items:center;gap:10px;margin:9px 0}
.bar .bl{font-size:12.5px;color:var(--muted)}
.bar .bt{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar .bf{height:100%;border-radius:999px;background:var(--primary)}
.bar .bv{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600}

/* cluster + generic table */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
table.tbl td.num,table.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl tr.totalrow td{font-weight:700;background:var(--primary-soft)}
.tablewrap{overflow-x:auto}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--surface-2);color:var(--muted)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* toolbar + inputs */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
input.search{min-width:230px;flex:1}
.btn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:var(--radius-sm);padding:9px 15px;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--primary);padding:7px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12px}

/* startups table */
.stbl{width:100%;border-collapse:collapse;font-size:12.5px}
.stbl th,.stbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.stbl th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;white-space:nowrap}
.stbl th:hover{color:var(--fg)}
.stbl tr{cursor:pointer}
.stbl tbody tr:hover td{background:var(--surface-2)}
.stbl .nm{font-weight:600;color:var(--fg)}
.stbl .sub{color:var(--faint);font-size:11px}
.count{color:var(--muted);font-size:12.5px}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);background:var(--bg);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25);animation:slin .18s ease}
@keyframes slin{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer .dh{position:sticky;top:0;background:var(--primary);color:var(--primary-ink);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:3}
.drawer .dh h2{font-size:16px}
.drawer .dh .x{background:rgba(255,255,255,.16);border:0;color:inherit;width:30px;height:30px;border-radius:8px;font-size:17px}
.drawer .db{padding:16px 18px}
.modal{align-items:center;justify-content:center}
.modal .box{background:var(--bg);width:min(760px,96%);max-height:92%;overflow:auto;border-radius:var(--radius);box-shadow:var(--shadow)}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%}
.sectitle{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);font-weight:700;margin:18px 0 2px;grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:12px}
.sectitle:first-child{border-top:0;margin-top:4px}
.founder-row{display:grid;grid-template-columns:1fr 1fr 110px 30px;gap:8px;align-items:center;margin-bottom:7px}
.inc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.inc-grid label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg);font-weight:500;padding:5px 7px;border:1px solid var(--line-soft);border-radius:7px}
.inc-grid input{width:auto}
.formbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:9px;justify-content:flex-end;margin-top:12px}

/* detail readout */
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.dl dt{color:var(--muted);font-weight:500}
.dl dd{margin:0;font-weight:500}
.hist{border-left:2px solid var(--line);padding-left:12px;margin-top:4px}
.hist .h{font-size:12px;margin-bottom:8px}
.hist .h b{font-weight:600}
.hist .h span{color:var(--faint);font-size:11px}

/* resources */
.reslist{display:grid;gap:10px}
.resitem{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.resitem .ri-t{flex:1;min-width:0}
.resitem .ri-t b{display:block;font-size:13.5px}
.resitem .ri-t span{display:block;font-size:11.5px;color:var(--faint);word-break:break-all}
.reshead{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);font-weight:700;margin:16px 0 2px}

/* import */
.imp-stat{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.imp-stat .s{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow)}
.imp-stat .s b{font-family:var(--mono);font-size:22px;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;box-shadow:var(--shadow);opacity:0;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* KITS coordination block */
.kitsblock .reshead{color:var(--accent)}
.kitsblock dl{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:11px 13px}
.kitsblock dt{color:var(--accent)}
/* remarks log */
.remarks{display:flex;flex-direction:column;gap:8px}
.remark{background:var(--surface-2);border:1px solid var(--line-soft);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:9px 11px}
.remark .rtxt{font-size:13px;white-space:pre-wrap}
.remark .rmeta{font-size:11px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
/* settings optrow */
.optrow{display:flex;gap:7px;margin-bottom:6px}
.optrow input{flex:1}
/* duplicates */
.duprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.duprow:last-child{border-bottom:0}
.dupmain{min-width:0;flex:1}
/* nav rail accent */
nav#side .navbtn.on{position:relative}
nav#side .navbtn.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--primary);border-radius:2px}
.kpi .val{font-family:var(--mono)}
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr}
  nav#side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;
    background:var(--surface);border-top:1px solid var(--line);padding:6px;z-index:50}
  nav#side .seg{display:none} nav#side .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 10px;white-space:nowrap}
  nav#side .navbtn .ic{width:auto}
  main{padding:16px 16px 90px} .fgrid{grid-template-columns:1fr} .founder-row{grid-template-columns:1fr 1fr 90px 28px}
}

#authgate{position:fixed;inset:0;background:var(--masthead);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#authgate .authbox{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:30px 28px;width:min(360px,100%);display:flex;flex-direction:column;gap:11px;text-align:center}
#authgate .authbox img{height:52px;margin:0 auto 4px}
#authgate h2{font-family:var(--display);font-size:20px}
#authgate .authsub{color:var(--muted);font-size:11px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.1em}
#authgate input{width:100%;padding:11px 12px;font-size:14px}
#authgate button{background:var(--primary);color:var(--primary-ink);border:0;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;cursor:pointer}
#authgate #auth_msg{color:var(--bad);font-size:12.5px;min-height:16px}
</style>

function countBy(rows,key){const m={};rows.forEach(r=>{const v=(r[key]||'—');m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}

function trendSvg(){
  const byDate={};S.startups.forEach(r=>{const d=(r.date||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))byDate[d]=(byDate[d]||0)+1;});
  const days=Object.keys(byDate).sort();
  const wrap=el('div',{class:'tablewrap'});
  if(days.length<2){wrap.append(el('div',{style:'color:var(--faint);font-size:12px;padding:8px'},'Not enough dated records to chart yet.'));return wrap;}
  let cum=0;const pts=days.map(d=>({d,y:(cum+=byDate[d])}));
  const W=Math.max(640,pts.length*7),H=200,PL=44,PR=14,PT=14,PB=34;const maxY=pts[pts.length-1].y;
  const x=i=>PL+(W-PL-PR)*(i/(pts.length-1));const y=v=>PT+(H-PT-PB)*(1-v/maxY);
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.style.maxWidth='none';svg.style.height='210px';
  const mk=(t,a)=>{const e=document.createElementNS(svgNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // gridlines + y labels
  for(let i=0;i<=4;i++){const gv=Math.round(maxY*i/4);const yy=y(gv);
    svg.append(mk('line',{x1:PL,y1:yy,x2:W-PR,y2:yy,stroke:'var(--line-soft)','stroke-width':1}));
    const tx=mk('text',{x:PL-8,y:yy+4,'text-anchor':'end','font-size':11,fill:'var(--muted)','font-family':'var(--mono)'});tx.textContent=gv;svg.append(tx);}
  // area + line
  let dpath=`M ${x(0)} ${y(pts[0].y)}`;pts.forEach((p,i)=>{if(i)dpath+=` L ${x(i)} ${y(p.y)}`;});
  const area=dpath+` L ${x(pts.length-1)} ${H-PB} L ${x(0)} ${H-PB} Z`;
  svg.append(mk('path',{d:area,fill:'var(--primary-soft)',opacity:.6}));
  svg.append(mk('path',{d:dpath,fill:'none',stroke:'var(--primary)','stroke-width':2.5,'stroke-linejoin':'round'}));
  const last=pts[pts.length-1];
  svg.append(mk('circle',{cx:x(pts.length-1),cy:y(last.y),r:4,fill:'var(--primary)'}));
  const lt=mk('text',{x:x(pts.length-1)-6,y:y(last.y)-9,'text-anchor':'end','font-size':12,fill:'var(--fg)','font-weight':700,'font-family':'var(--mono)'});lt.textContent=last.y;svg.append(lt);
  // x labels (first, middle, last)
  [0,Math.floor(pts.length/2),pts.length-1].forEach(i=>{const tx=mk('text',{x:x(i),y:H-12,'text-anchor':'middle','font-size':10.5,fill:'var(--muted)','font-family':'var(--mono)'});tx.textContent=pts[i].d.slice(5);svg.append(tx);});
  wrap.append(svg);return wrap;
}
/* ---------- DUPLICATES ---------- */
function findDupGroups(){
  const rows=S.startups;const used=new Set();const groups=[];
  for(let i=0;i<rows.length;i++){
    if(used.has(rows[i].id))continue;
    const a=rows[i];const grp=[a];
    for(let j=i+1;j<rows.length;j++){
      const b=rows[j];if(used.has(b.id))continue;
      const sameName=norm(a.name)&&norm(a.name)===norm(b.name);
      const dn=(a.dpiitNo||'').replace(/\s/g,'').toLowerCase();const sameDpiit=dn&&dn===(b.dpiitNo||'').replace(/\s/g,'').toLowerCase();
      const emailsA=[a.email,...(a.founders||[]).map(f=>f.email)].filter(Boolean).map(e=>e.toLowerCase());
      const emailsB=[b.email,...(b.founders||[]).map(f=>f.email)].filter(Boolean).map(e=>e.toLowerCase());
      const sameEmail=emailsA.some(e=>emailsB.includes(e));
      const phonesA=[a.phone,...(a.founders||[]).map(f=>f.phone)].filter(Boolean).map(p=>p.replace(/\D/g,'').slice(-10)).filter(x=>x.length===10);
      const phonesB=[b.phone,...(b.founders||[]).map(f=>f.phone)].filter(Boolean).map(p=>p.replace(/\D/g,'').slice(-10)).filter(x=>x.length===10);
      const samePhone=phonesA.some(p=>phonesB.includes(p));
      const sim=simNames(a.name,b.name);
      if(sameName||sameDpiit||sameEmail||samePhone||sim>=0.6){
        b._why=sameDpiit?'Same DPIIT no.':sameName?'Same name':sameEmail?'Shared email':samePhone?'Shared phone':'Similar name ('+Math.round(sim*100)+'%)';
        grp.push(b);used.add(b.id);
      }
    }
    if(grp.length>1){grp.forEach(x=>used.add(x.id));groups.push(grp);}
  }
  return groups;
}
function viewDuplicates(m){
  m.append(el('div',{class:'page-h'},el('div',{},el('h1',{},'Duplicate Review'),el('p',{},'Suspected duplicates found by DPIIT number, email, phone, exact name and similar name — even when the email differs'))));

async function mergeInto(primaryId,secId){
  const p=S.startups.find(x=>x.id===primaryId),s=S.startups.find(x=>x.id===secId);if(!p||!s)return;
  const r=JSON.parse(JSON.stringify(p));
  ['district','cluster','sector','stage','dpiitNo','kitsNo','event','reason','support','action','notes','fuDate'].forEach(k=>{if(!r[k]&&s[k])r[k]=s[k];});
  if(s.dpiit==='Yes')r.dpiit='Yes';
  const rank={'Yes':4,'In Progress':3,'No':2,'No - Not Aware':1,'':0};
  if((rank[s.skReg]||0)>(rank[r.skReg]||0))r.skReg=s.skReg;
  if(s.fiApplied==='Yes')r.fiApplied='Yes';
  r.incentives=Array.from(new Set([...(r.incentives||[]),...(s.incentives||[])]));
  r.founders=r.founders||[];(s.founders||[]).forEach(f=>{if(f.name&&!r.founders.some(x=>norm(x.name)===norm(f.name)))r.founders.push(f);});
  r.remarks=[...(r.remarks||[]),...(s.remarks||[])];
  r.remarks.push({text:'Merged duplicate record "'+(s.name||'')+'" into this startup',at:new Date().toISOString(),by:S.me||'',byName:S.meName||ADMIN_NAME});
  r.history=r.history||[];r.history.push({action:'Merged duplicate',at:new Date().toISOString(),by:S.me||'',byName:S.meName||''});
  const ok=await writeStartup(r);
  if(ok){
    if(S.db){try{await S.db.collection('startups').doc(secId).delete();}catch(e){}}
    if(!S.dbReady){const i=S.startups.findIndex(x=>x.id===primaryId);if(i>=0)S.startups[i]=r;S.startups=S.startups.filter(x=>x.id!==secId);}
    toast('Merged');renderMain();
  }
}
async function dismissDup(grp){
  // record a remark on each so the pairing is acknowledged and they won't be re-merged by mistake
  for(const r0 of grp){
    const r=JSON.parse(JSON.stringify(S.startups.find(x=>x.id===r0.id)));if(!r)continue;
    r.remarks=r.remarks||[];r.remarks.push({text:'Reviewed — confirmed NOT a duplicate of the other matched record(s)',at:new Date().toISOString(),by:S.me||'',byName:S.meName||ADMIN_NAME});
    r.dupOk=true;await writeStartup(r);
    if(!S.dbReady){const i=S.startups.findIndex(x=>x.id===r.id);if(i>=0)S.startups[i]=r;}
  }
  toast('Marked as not duplicates');renderMain();
}

async function saveForm(r,inline){
  if(!r.name||!r.name.trim()){toast('Startup name is required');return;}
  r.cluster=r.cluster||toCluster(r.district);
  // primary email/phone mirror from first founder for search/export
  const f0=(r.founders||[]).find(f=>f.email)||r.founders[0]||{};
  r.email=r.email||f0.email||'';r.phone=r.phone||f0.phone||'';
  const isNew=S.editing==='new'||!r.id;
  if(isNew){r.id='s'+Date.now().toString(36)+Math.floor(Math.random()*1000);r.date=r.date||todayStr();}
  r.history=r.history||[];
  r.history.push({action:isNew?'Created':'Edited',at:new Date().toISOString(),by:S.me||'',byName:S.meName||''});
  if(r.history.length>20)r.history=r.history.slice(-20);
  const ok=await writeStartup(r);
  if(ok){toast(isNew?'Startup added':'Changes saved');S.editing=null;
    if(!S.dbReady){const i=S.startups.findIndex(x=>x.id===r.id);if(i<0)S.startups.push(r);else S.startups[i]=r;}
    if(inline){go('startups');}else{S.detail=isNew?null:r.id;renderOverlay();}
    renderMain();}
}
async function writeStartup(r){
  if(!S.db||!S.canWrite){
    if(!S.dbReady){return true;} // local-only fallback display
    toast('You have view-only access');return false;
  }
  try{await S.db.collection('startups').doc(r.id).set(r);return true;}
  catch(e){if(e&&e.code==='invalid_argument'){S.canWrite=false;renderWho();renderMain();toast('You have view-only access');}else{toast('Could not save — try again');}return false;}
}
async function addRemark(id,text){
  const src=S.startups.find(x=>x.id===id);if(!src)return;
  const r=JSON.parse(JSON.stringify(src));r.remarks=r.remarks||[];
  r.remarks.push({text:text,at:new Date().toISOString(),by:S.me||'',byName:S.meName||ADMIN_NAME});
  if(r.remarks.length>50)r.remarks=r.remarks.slice(-50);
  r.history=r.history||[];r.history.push({action:'Remark added',at:new Date().toISOString(),by:S.me||'',byName:S.meName||''});
  const ok=await writeStartup(r);
  if(ok){if(!S.dbReady){const i=S.startups.findIndex(x=>x.id===id);if(i>=0)S.startups[i]=r;}toast('Remark added');S.detail=id;renderOverlay();}
}

function normH(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function guessField(header){
  const h=normH(header);if(!h)return '';
  for(const f of IMPORT_FIELDS){if(f.syn.some(s=>h===s))return f.k;}
  let best='',bestlen=0;
  for(const f of IMPORT_FIELDS){for(const s of f.syn){if((h.includes(s)||s.includes(h))&&s.length>bestlen){best=f.k;bestlen=s.length;}}}
  return best;
}

function handleImportFile(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  $('#impfname').textContent=file.name;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      const rows=aoa.filter(r=>r.some(c=>String(c).trim()!==''));
      if(rows.length<2){toast('File has no data rows');return;}
      S._imp={headers:rows[0].map(h=>String(h).trim()),rows:rows.slice(1)};
      S._impMap=S._imp.headers.map(h=>guessField(h));
      renderMapping();
    }catch(err){toast('Could not read this file — try saving it as .xlsx or .csv');}
  };
  rd.readAsArrayBuffer(file);
}

  const map=$('#impmap');map.innerHTML='';$('#imparea').innerHTML='';

  const card=el('div',{class:'card'});
  card.append(el('div',{class:'ch'},el('h3',{},'Confirm column matches'),el('span',{class:'note'},H.length+' columns · '+S._imp.rows.length+' rows')));

function buildRec(raw){
  const rec={};S._imp.headers.forEach((h,i)=>{const k=S._impMap[i];if(k){const v=String(raw[i]==null?'':raw[i]).trim();if(v!=='')rec[k]=v;}});
  return rec;
}
function normVals(r){
  if(r.dpiit!=null)r.dpiit=yn(r.dpiit);
  if(r.met!=null)r.met=yn(r.met);
  if(r.consent!=null)r.consent=yn(r.consent);
  if(r.aware!=null)r.aware=yn(r.aware);
  if(r.appliedSK!=null)r.appliedSK=yn(r.appliedSK);
  if(r.fiApplied!=null)r.fiApplied=fiv(r.fiApplied);
  if(r.skReg!=null)r.skReg=skv(r.skReg);
  if(r.appStage!=null)r.appStage=matchList(r.appStage,LISTS['Application Stage']||[])||r.appStage;
  if(r.priority!=null)r.priority=matchList(r.priority,['High','Medium','Low'])||r.priority;
  r.cluster=r.cluster&&CLUSTERS.includes(r.cluster)?r.cluster:toCluster(r.district||'');
  if(r.incentives!=null){r.incentives=String(r.incentives).split(/[,;]+/).map(x=>matchIncentive(x)).filter(Boolean);}
  return r;
}
function yn(v){v=String(v||'').toLowerCase();return v.startsWith('y')?'Yes':'No';}
function fiv(v){v=String(v||'').toLowerCase();if(v.startsWith('y'))return 'Yes';if(v.includes('plan'))return 'Planning to Apply';if(v.includes('not elig'))return 'Not Eligible';return 'No';}
function skv(v){v=String(v||'').toLowerCase();if(v.startsWith('yes')||v.includes('already'))return 'Yes';if(v.includes('prog')||v.includes('awaiting')||v.includes('applied'))return 'In Progress';if(v.includes('aware'))return 'No - Not Aware';return 'No';}
function matchList(v,list){const n=normH(v);return list.find(o=>normH(o)===n)||list.find(o=>normH(o).includes(n)&&n.length>2)||'';}
const INCMAP=[['state gst','State GST'],['internship','Internship'],['patent','Patent'],['pf','PF/ESI'],['esi','PF/ESI'],['r&d','R&D Grant'],['research','R&D Grant'],['cloud','Cloud Storage'],['quality','Quality Cert.'],['marketing','Marketing']];
function matchIncentive(x){const s=x.toLowerCase();for(const[k,v]of INCMAP)if(s.includes(k))return v;return '';}
function findExisting(rec){
  const dn=(rec.dpiitNo||'').replace(/\s/g,'').toLowerCase();
  const em=(rec.email||'').toLowerCase();
  const nm=norm(rec.name||'');
  return S.startups.find(s=>
    (dn&&(s.dpiitNo||'').replace(/\s/g,'').toLowerCase()===dn)||
    (em&&((s.email||'').toLowerCase()===em||(s.founders||[]).some(f=>(f.email||'').toLowerCase()===em)))||
    (nm&&norm(s.name)===nm));
}
function previewImport(){
  const upd=$('#impupd')?$('#impupd').checked:true;
  const area=$('#imparea');area.innerHTML='';
  const recs=S._imp.rows.map(buildRec).filter(r=>r.name||r.email||r.dpiitNo).map(normVals);
  if(!recs.length){area.append(el('div',{class:'banner warn'},'No usable rows — make sure a Startup Name (or email/DPIIT) column is mapped.'));return;}
  let nw=0,up=0,sk=0,po=0;const seen=new Set();
  recs.forEach(r=>{
    const ex=findExisting(r);const key=norm(r.name)||(r.email||'').toLowerCase();
    if(ex&&!seen.has('x'+ex.id)){r._mode=upd?'update':'skip';r._target=ex.id;if(upd){up++;seen.add('x'+ex.id);}else sk++;return;}
    if(seen.has(key)){r._mode='skip';sk++;return;}
    const poss=S.startups.find(s=>norm(s.name)!==norm(r.name)&&simNames(s.name,r.name)>=0.6);
    if(poss){r._mode='possible';r._possibleName=poss.name;po++;seen.add(key);return;}
    r._mode='new';nw++;seen.add(key);
  });
  area.append(el('div',{class:'imp-stat'},
    el('div',{class:'s'},el('b',{},String(recs.length)),'rows'),
    el('div',{class:'s'},el('b',{style:'color:var(--good)'},String(nw)),'new'),
    el('div',{class:'s'},el('b',{style:'color:var(--info)'},String(up)),'updates'),
    el('div',{class:'s'},el('b',{style:'color:var(--warn)'},String(po)),'possible dups'),
    el('div',{class:'s'},el('b',{style:'color:var(--faint)'},String(sk)),'skipped')));
  if(po)area.append(el('div',{class:'banner warn',style:'margin-top:0'},po+' row(s) look similar to an existing startup but have different contact details. They will be imported and flagged in their Remarks as “possible duplicate” so you can verify them on the Duplicates page.'));
  const tw=el('div',{class:'tablewrap card',style:'margin-top:8px;max-height:44vh;overflow:auto'});
  const t=el('table',{class:'stbl'});
  t.append(el('thead',{},el('tr',{},...['Action','Startup','Founder','Cluster','DPIIT','SK Reg','FI'].map(h=>el('th',{},h)))));
  const tb=el('tbody');
  recs.slice(0,400).forEach(r=>tb.append(el('tr',{},
    el('td',{},r._mode==='new'?el('span',{class:'chip good'},'New'):r._mode==='update'?el('span',{class:'chip info'},'Update'):r._mode==='possible'?el('span',{class:'chip warn'},'Possible dup'):el('span',{class:'chip mute'},'Skip')),
    el('td',{},el('span',{class:'nm'},r.name||'(no name)'),r._mode==='possible'?el('div',{class:'sub',style:'font-size:11px;color:var(--warn)'},'similar to: '+r._possibleName):null),el('td',{},r.founder||'—'),el('td',{},r.cluster),el('td',{},r.dpiit||'—'),el('td',{},r.skReg||'—'),el('td',{},r.fiApplied||'—'))));
  t.append(tb);tw.append(t);area.append(tw);
  const doIt=recs.filter(r=>r._mode==='new'||r._mode==='update'||r._mode==='possible');
  const b=el('button',{class:'btn',style:'margin-top:12px',onclick:()=>commitImport(doIt)},`Apply — ${nw} new + ${up} updates${po?(' + '+po+' flagged'):''}`);
  if(!S.canWrite){b.disabled=true;b.title='Editor access required';}
  area.append(b);
}
async function commitImport(recs){
  if(!recs.length){toast('Nothing to apply');return;}
  if(!S.canWrite){toast('You have view-only access');return;}
  let n=0,u=0;
  for(const r of recs){
    let rec;
    if(r._mode==='update'&&r._target){
      const ex=S.startups.find(x=>x.id===r._target);rec=JSON.parse(JSON.stringify(ex));
      ['district','cluster','sector','stage','dpiit','dpiitNo','skReg','kitsNo','appliedSK','kitsConfReg','fiApplied','appStage','kitsConfInc','aware','reason','support','action','event','priority','consent','planning','met','notes'].forEach(k=>{if(r[k]!=null&&r[k]!=='')rec[k]=r[k];});
      if(r.incentives&&r.incentives.length)rec.incentives=Array.from(new Set([...(rec.incentives||[]),...r.incentives]));
      if(r.founder){rec.founders=rec.founders||[];if(!rec.founders.some(f=>norm(f.name)===norm(r.founder)))rec.founders.push({name:r.founder,email:r.email||'',phone:r.phone||''});}
      rec.history=rec.history||[];rec.history.push({action:'Updated via import',at:new Date().toISOString(),by:S.me||'',byName:S.meName||''});
      if(rec.history.length>20)rec.history=rec.history.slice(-20);
    }else{
      rec=blankStartup();rec.id='s'+Date.now().toString(36)+Math.floor(Math.random()*100000);
      Object.keys(r).forEach(k=>{if(k[0]!=='_'&&r[k]!=null)rec[k]=r[k];});
      rec.founders=[{name:r.founder||'',email:r.email||'',phone:r.phone||''}];
      rec.source=rec.source||'Event / Meeting';rec.date=rec.date||todayStr();
      rec.history=[{action:'Imported',at:new Date().toISOString(),by:S.me||'',byName:S.meName||''}];
      if(r._mode==='possible'&&r._possibleName){rec.remarks=[{text:'⚠ Possible duplicate of "'+r._possibleName+'" (different contact details) — verify on Duplicates page',at:new Date().toISOString(),by:S.me||'',byName:S.meName||ADMIN_NAME}];}
    }
    const ok=await writeStartup(rec);
    if(ok){if(r._mode==='update')u++;else n++;if(!S.dbReady){const i=S.startups.findIndex(x=>x.id===rec.id);if(i<0)S.startups.push(rec);else S.startups[i]=rec;}}
    await new Promise(res=>setTimeout(res,6));
  }
  toast(`Applied: ${n} new, ${u} updated`);S._imp=null;go('startups');
}

/* ---------- REPORTS ---------- */
function viewReports(m){
  m.append(el('div',{class:'page-h'},el('div',{},el('h1',{},'Reports'),el('p',{},'Period summary for KITS & the department — copy or download anytime'))));
  const bar=el('div',{class:'toolbar'});
  const sel=el('select',{id:'repperiod',onchange:renderReport});
  [['all','All time'],['month','This month'],['week','This 7 days']].forEach(([v,l])=>sel.append(el('option',{value:v},l)));
  bar.append(el('span',{style:'color:var(--muted)'},'Period:'),sel,el('button',{class:'btn sec sm',onclick:()=>copyText(reportText(),'Report copied — paste into email or WhatsApp')},'Copy summary'),el('button',{class:'btn sm',onclick:exportExcel},'Download Excel'));
  m.append(bar);
  m.append(el('div',{id:'repbody'}));
  renderReport();
}
function repRows(){
  const p=$('#repperiod')?$('#repperiod').value:'all';if(p==='all')return S.startups;
  const now=new Date();const cut=new Date(now);cut.setDate(now.getDate()-(p==='week'?7:30));
  return S.startups.filter(r=>{const d=new Date(r.date);return !isNaN(d)&&d>=cut;});
}
function renderReport(){
  const body=$('#repbody');if(!body)return;body.innerHTML='';
  const rows=repRows();const k=kpis(rows);
  const tiles=[['Engaged',k.total],['DPIIT',k.dpiit],['SK Registered',k.skYes],['Reg. In Progress',k.skProg],['Not Registered',k.skNo],['FI Applied',k.fiYes],['FI In Progress',k.fiProg],['Benefits',k.benefits],['Founders Met',k.met]];
  const kp=el('div',{class:'kpis'});tiles.forEach(([l,v])=>kp.append(el('div',{class:'kpi'},el('div',{class:'lab'},l),el('div',{class:'val'},String(v)))));
  body.append(kp);
  body.append(el('div',{class:'banner info',style:'margin-top:14px'},'To send this out: use “Copy summary” (paste into Gmail/WhatsApp) or “Download Excel”. Fully automated scheduled email is not available on this free hosting — the copy/download takes a few seconds and needs no setup.'));
}
function reportText(){
  const rows=repRows();const k=kpis(rows);const p=$('#repperiod')?$('#repperiod').options[$('#repperiod').selectedIndex].text:'All time';
  const L=['KDEM Startup Karnataka — Tracker Summary ('+p+')','Generated: '+new Date().toLocaleString('en-IN'),'',
    'Total startups engaged: '+k.total,'DPIIT recognised: '+k.dpiit,'Registered on Startup Karnataka: '+k.skYes,
    'Registration in progress: '+k.skProg,'Not yet registered: '+k.skNo,'Fiscal incentive applied: '+k.fiYes,
    'Fiscal incentive in progress: '+k.fiProg,'Benefits received/disbursed: '+k.benefits,'Founders met in person: '+k.met,
    'KITS verification in progress: '+k.kitsProg,'KITS replied — selected: '+k.kitsSel,'',
    'Cluster-wise engaged:'];
  CLUSTERS.forEach(c=>L.push('  '+c+': '+rows.filter(r=>r.cluster===c).length));
  L.push('','— KDEM, Startup & Innovation Team');
  return L.join('\n');
}

function viewAudit(m){

  const events=[];

  events.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  if(!events.length){m.append(el('div',{class:'banner info'},'No changes recorded yet. Every add, edit and import will appear here with the editor and time.'));return;}
  const wrap=el('div',{class:'card'});const tw=el('div',{class:'tablewrap'});

  t.append(el('thead',{},el('tr',{},...['When','Action','Startup','By'].map(h=>el('th',{},h)))));

    el('td',{},fmtWhen(e.at)),el('td',{},el('span',{class:'chip '+(e.action==='Created'?'good':e.action==='Imported'?'info':'mute')},e.action||'Edited')),

async function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Export library still loading — try again');return;}
  const rows=S.startups.map((r,i)=>({
    'Sl.No':i+1,'Date':r.date,'Source':r.source,'Startup Name':r.name,
    'Founders':(r.founders||[]).map(f=>f.name).filter(Boolean).join('; '),
    'Founder Emails':(r.founders||[]).map(f=>f.email).filter(Boolean).join('; '),
    'Founder Phones':(r.founders||[]).map(f=>f.phone).filter(Boolean).join('; '),
    'Founder Met':r.met,'Event':r.event,'Sector':r.sector,'Stage':r.stage,
    'District':r.district,'KDEM Cluster':r.cluster,'DPIIT Recognised':r.dpiit,'DPIIT No':r.dpiitNo,
    'SK Registered':r.skReg,'KITS Reg No':r.kitsNo,'Applied for SK Reg':r.appliedSK,'SK Application Date':r.appSKdate,'KITS Reply (Reg)':r.kitsConfReg,
    'Fiscal Incentive Applied':r.fiApplied,'FI Application Date':r.fiDate,'Incentives Availed':(r.incentives||[]).join(', '),'KITS Reply (Incentive)':r.kitsConfInc,
    'Planning to Apply':r.planning,'Application Stage':r.appStage,'Aware of Incentives':r.aware,
    'Reason / Challenge':r.reason,'Support Required':r.support,'KDEM Action':r.action,'Notes':r.notes,
    'Priority':r.priority,'Next Follow-up':r.fuDate,'Consent':r.consent,
    'Action Needed from KITS':r.kitsActionNeeded,'KITS Status':r.kitsStatus,'KITS Response':r.kitsResponse,'KITS Action Taken':r.kitsActionTaken
  }));
  const k=kpis(S.startups);
  const summary=[
    ['KDEM Startup Karnataka — Tracker Export',''],['Generated',new Date().toLocaleString('en-IN')],['',''],
    ['Total Startups Engaged',k.total],['DPIIT Recognised',k.dpiit],['Registered on Startup Karnataka',k.skYes],
    ['Registration In Progress',k.skProg],['Not Yet Registered',k.skNo],['Fiscal Incentive Applied',k.fiYes],
    ['Fiscal Incentive In Progress',k.fiProg],['Benefits Received / Disbursed',k.benefits],['Founders Met in Person',k.met],
    ['KITS Verification In Progress',k.kitsProg],['KITS Reply Selected',k.kitsSel],['KITS Reply Rejected',k.kitsRej],['',''],['Cluster','Engaged']
  ];
  CLUSTERS.forEach(cl=>summary.push([cl,S.startups.filter(r=>r.cluster===cl).length]));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Dashboard');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Master Tracker');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const fname=`KDEM_Startup_Tracker_${todayStr()}.xlsx`;
  const dl=await safeUse('downloads');
  if(dl&&dl.save){try{await dl.save({filename:fname,data:new Uint8Array(out)});toast('Excel ready');return;}catch(e){}}
  // fallback: blob link (works outside artifact sandbox)
  try{const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=el('a',{href:URL.createObjectURL(blob),download:fname});document.body.append(a);a.click();a.remove();toast('Excel downloaded');}
  catch(e){toast('Download not available in this view');}
}

/* ---------- CAPABILITY BOOT ---------- */
async function safeUse(name){try{return window.claude&&claude.use?await claude.use(name):null;}catch(e){return null;}}
async function boot(){
  renderNav();renderWho();renderMain();
  $('#exportBtn').addEventListener('click',exportExcel);
  window.addEventListener('hashchange',()=>{const v=(location.hash||'#dashboard').slice(1);if(v!==S.view){S.view=v;renderNav();renderMain();}});

  const user=await safeUse('user');
  if(user){S.user=user;
    try{S.me=await user.id();}catch(e){}
    let isOwner=false;try{isOwner=!!(user.isOwner&&user.isOwner());}catch(e){}
    try{const meObj=await user.me();S.meName=(meObj&&(meObj.name||meObj.displayName))||'';}catch(e){}
    if(isOwner)S.meName=ADMIN_NAME; // this tracker's admin is Vikas Vishwakarma
    try{const w=user.can?user.can('data.write'):null;S.canWrite=(w===true)||(user.canEdit&&user.canEdit())||isOwner;}catch(e){S.canWrite=false;}
    renderWho();
  }
  const db=await safeUse('db');
  if(db){S.db=db;
    await loadConfig();renderMain();
    try{
      db.collection('startups').onSnapshot(snap=>{
        if(snap.empty && !S.dbReady){ // db reachable but not seeded yet — keep showing loaded data
          S.dbReady=true;renderWho();renderMain();return;
        }
        S.startups=snap.docs.map(d=>({id:d.id,...d.data()}));
        S.dbReady=true;renderWho();renderMain();
      },err=>{/* keep seed data visible */});
    }catch(e){}
  }
}
window.__startApp=boot;
</script>

  let cfg={};
  try{cfg=await (await fetch('/api/public-config')).json();}catch(e){}
  window.__ADMIN_EMAIL=(cfg.adminEmail||'').toLowerCase();
  if(!cfg.url||!cfg.anonKey){document.body.innerHTML='<p style="font-family:sans-serif;padding:40px">Server not configured yet. Set SUPABASE_URL and SUPABASE_ANON_KEY in Vercel environment variables.</p>';return;}
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  window.__sb=sb;

  function showLogin(msg){
    let o=document.getElementById('authgate');
    if(!o){o=document.createElement('div');o.id='authgate';
      o.innerHTML='<div class="authbox"><img src="'+LOGO+'" alt="KDEM"><h2>Startup Ecosystem Tracker</h2><p class="authsub">Karnataka Digital Economy Mission</p><input id="auth_email" type="email" placeholder="Work email" autocomplete="username"><input id="auth_pass" type="password" placeholder="Password" autocomplete="current-password"><button id="auth_btn">Sign in</button><div id="auth_msg"></div></div>';
      document.body.appendChild(o);
      document.getElementById('auth_btn').onclick=doLogin;
      document.getElementById('auth_pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
    }
    document.getElementById('auth_msg').textContent=msg||'';
    o.style.display='flex';
  }
  async function doLogin(){
    const email=document.getElementById('auth_email').value.trim();
    const pass=document.getElementById('auth_pass').value;
    document.getElementById('auth_msg').style.color='var(--muted)';
    document.getElementById('auth_msg').textContent='Signing in…';
    const {error}=await sb.auth.signInWithPassword({email:email,password:pass});
    if(error){document.getElementById('auth_msg').style.color='var(--bad)';document.getElementById('auth_msg').textContent=error.message;return;}
    location.reload();
  }

  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin('');return;}

  let role='viewer';
  try{const {data}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(data&&data.role)role=data.role;}catch(e){}

  const email=session.user.email||'';
  const isAdmin=!!(window.__ADMIN_EMAIL && email.toLowerCase()===window.__ADMIN_EMAIL);
  const canWrite=isAdmin||role==='admin'||role==='editor';
  function mapErr(e){return {code:'invalid_argument',message:(e&&e.message)||'write failed'};}
  const userCap={
    async id(){return session.user.id;},
    async me(){return {name:(session.user.user_metadata&&session.user.user_metadata.full_name)||email};},
    isOwner(){return isAdmin;},
    canEdit(){return canWrite;},
    can(k){if(k==='data.write')return canWrite;return null;},
    async profiles(ids){const out={};try{const {data}=await sb.from('profiles').select('id,email').in('id',ids||[]);(data||[]).forEach(function(p){out[p.id]={name:p.email};});}catch(e){}return out;}
  };
  function docRef(id){return {
    async set(obj){const {error}=await sb.from('startups').upsert({id:id,data:obj,updated_at:new Date().toISOString(),updated_by:email});if(error)throw mapErr(error);},
    async delete(){await sb.from('startups').delete().eq('id',id);},
    async get(){const {data}=await sb.from('startups').select('data').eq('id',id).maybeSingle();return {exists:!!data,data:function(){return data&&data.data;}};}
  };}
  function configDoc(key){return {
    async get(){const {data}=await sb.from('config').select('data').eq('key',key).maybeSingle();return {exists:!!data,data:function(){return data&&data.data;},metadata:{}};},
    async set(obj){const {error}=await sb.from('config').upsert({key:key,data:obj});if(error)throw mapErr(error);}
  };}
  let deb=null;
  const dbCap={
    collection:function(path){return {
      onSnapshot:function(cb,err){
        const load=async function(){
          const {data,error}=await sb.from('startups').select('id,data').order('updated_at',{ascending:false}).limit(25000);
          if(error){if(err)err(mapErr(error));return;}
          cb({empty:(data||[]).length===0,docs:(data||[]).map(function(r){return {id:r.id,data:function(){return r.data;}};})});
        };
        load();
        const ch=sb.channel('st-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'startups'},function(){clearTimeout(deb);deb=setTimeout(load,400);}).subscribe();
        return function(){try{sb.removeChannel(ch);}catch(e){}};
      },
      doc:function(id){return docRef(id);}
    };},
    doc:function(path){const p=path.split('/');if(p[0]==='config')return configDoc(p[1]);return docRef(p[1]||p[0]);}
  };
  const downloadsCap={save:async function(o){try{const blob=new Blob([o.data],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){return false;}}};

  window.claude={use:async function(name){return name==='db'?dbCap:name==='user'?userCap:name==='downloads'?downloadsCap:null;}};

  window.__requestEmail=async function(to,subject,bodyHtml){
    const s=(await sb.auth.getSession()).data.session;
    const resp=await fetch('/api/email-request',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({to:to,subject:subject,bodyHtml:bodyHtml})});
    if(!resp.ok)throw new Error(await resp.text());return resp.json();
  };
  window.__signOut=async function(){await sb.auth.signOut();location.reload();};

  if(window.__startApp)window.__startApp();
  var so=document.getElementById('signoutBtn');if(so)so.onclick=window.__signOut;
})();
</script>
